<!DOCTYPE html>
<html>
  <head>
    <title>Replace</title>
    <style>
      body {
        font-family: Arial;
        width: 230px;
        padding: 10px;
      }
      input {
        width: 100%;
        margin: 5px 0;
        padding: 5px;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h3>Input Replace</h3>

    <label>Find:</label>
    <input type="text" id="findText" placeholder="e.g. 18" />

    <label>Replace with:</label>
    <input type="text" id="replaceText" placeholder="e.g. 0" />

    <button id="runBtn">Replace Now</button>

    <script src="popup.js"></script>
  </body>
</html>
